<style>

<script>
/* ===== Librerías de PDF: se cargan recién al exportar =====
   Antes jsPDF y pdf-lib se descargaban al abrir la app y bloqueaban el dibujo
   de la pantalla. Ahora se piden sólo cuando se aprieta "Exportar PDF", y una
   sola vez por sesión. */
let pdfLibsPromise = null;
function cargarScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('No se pudo cargar ' + url));
    document.head.appendChild(s);
  });
}
function cargarLibreriasPDF(){
  if(!pdfLibsPromise){
    pdfLibsPromise = Promise.all([
      cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
      cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js')
    ]).catch(err => { pdfLibsPromise = null; throw err; });
  }
  return pdfLibsPromise;
}

/* ===== CONEXIÓN CON GOOGLE APPS SCRIPT =====
   Pegá acá abajo, entre las comillas, la URL de tu Web App de Google Apps Script
   (la que termina en /exec). Instrucciones completas en el chat de Claude. */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1HT-w2zvFberXinYXnDMEd7t9q4pP5viUX5gR-KwdHAwr3aZ0T0KEceSy3eelbtVX/exec";
/* ============================================ */

const hasCloudBackend = APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('https://') === 0;
let usingLocalFallback = !hasCloudBackend;

/* ===== INTERRUPTOR DE VUELTA ATRÁS =====
   Con true, los archivos nuevos (fotos, PDF, Word, Excel) se guardan en Google
   Drive (rápido). Si algo fallara, poné esto en false: la app vuelve a guardar
   los archivos dentro de la planilla como antes (base64), sin tocar nada más.
   Todo lo ya cargado sigue viéndose en ambos casos. */
const USAR_DRIVE = true;

// Sube un archivo a Drive a través del backend. Devuelve {fileId, fileName} o null.
async function subirArchivoADrive(dataUrl, fileName){
  if(!hasCloudBackend) return null;
  const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl || '');
  if(!m) return null;
  const mimeType = m[1], dataBase64 = m[2];
  try{
    const res = await fetchConLimite(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'uploadFile', fileName, mimeType, dataBase64 })
    }, TIMEOUT_GUARDADO_MS);
    const data = await res.json();
    if(data && data.fileId) return data;
    console.error('uploadFile sin fileId', data);
    return null;
  }catch(e){ console.error('Error subiendo a Drive', e); return null; }
}

// Borra un archivo de Drive (mejor esfuerzo; no frena nada si falla).
function borrarArchivoDeDrive(fileId){
  if(!hasCloudBackend || !fileId) return;
  try{
    fetchConLimite(`${APPS_SCRIPT_URL}?action=deleteFile&fileId=${encodeURIComponent(fileId)}`, null, TIMEOUT_LECTURA_MS).catch(()=>{});
  }catch(e){}
}

// Junta todos los fileId (de Drive) que contiene uno o varios registros/ítems,
// mirando todos los lugares posibles (archivo principal, fotos, adjuntos, etc.).
function fileIdsDe(){
  const ids = [];
  const add = f => { if(f && f.fileId) ids.push(f.fileId); };
  const walk = r => {
    if(!r) return;
    add(r);                                   // foto/documento/contrato: archivo principal
    (r.extraFotos||[]).forEach(add);
    (r.fotos||[]).forEach(add);
    (r.archivos||[]).forEach(add);
    (r.comprobantesPago||[]).forEach(add);
    (r.copiasInfraccion||[]).forEach(add);
    add(r.checklist);                          // alquiler
  };
  for(const r of arguments) walk(r);
  return ids;
}
// Borra de Drive todos los archivos de un registro (al eliminarlo por completo).
function borrarArchivosDe(){
  fileIdsDe.apply(null, arguments).forEach(borrarArchivoDeDrive);
}
// Al editar: borra de Drive solo los archivos que estaban antes y ya no están.
// Así nunca queda una miniatura rota; a lo sumo, un archivo huérfano inofensivo.
function reconciliarBorrado(viejo, nuevo){
  const antes = fileIdsDe(viejo);
  const despues = new Set(fileIdsDe(nuevo));
  antes.forEach(id => { if(!despues.has(id)) borrarArchivoDeDrive(id); });
}
// Cuando se saca un adjunto de un formulario con la ✕:
//  - si se está CREANDO un registro nuevo (editandoId falsy), el archivo recién
//    subido queda huérfano, así que se borra de Drive en el acto.
//  - si se está EDITANDO uno ya guardado, NO se borra acá (de eso se encarga la
//    reconciliación al guardar), para que "Cancelar" nunca rompa un archivo.
function quitarTempDeDrive(item, editandoId){
  if(!editandoId && item && item.fileId) borrarArchivoDeDrive(item.fileId);
}

// URL para mostrar un archivo. Si está en Drive usa su URL directa (rápida);
// si es un archivo viejo (base64) usa el dato guardado. 'kind':
//   img      -> miniatura de imagen (grilla)
//   imgBig   -> imagen grande (visor)
//   pdf      -> vista previa de PDF (iframe)
//   download -> descargar / abrir
function fileUrl(item, kind){
  if(!item) return '';
  if(item.fileId){
    if(kind==='img')     return `https://drive.google.com/thumbnail?id=${item.fileId}&sz=w400`;
    if(kind==='imgBig')  return `https://drive.google.com/thumbnail?id=${item.fileId}&sz=w1600`;
    if(kind==='pdf')     return `https://drive.google.com/file/d/${item.fileId}/preview`;
    return `https://drive.google.com/uc?export=download&id=${item.fileId}`;
  }
  return item.fileData || '';
}

// Si la miniatura de Drive todavía no está lista (recién subida), se reintenta
// una vez por el otro CDN de Google antes de darse por vencida.
function imgFallback(img){
  if(img.dataset.fb) return;
  const fid = img.dataset.fid;
  if(!fid){ return; }
  img.dataset.fb = '1';
  img.src = `https://lh3.googleusercontent.com/d/${fid}=w600`;
}

/* ===== Tiempo límite para la red =====
   Sin esto, con señal débil la app se quedaba esperando para siempre y parecía
   trabada. Ahora corta y avisa. Leer tiene un límite corto; guardar uno más
   largo, porque puede estar subiendo fotos. */
const TIMEOUT_LECTURA_MS = 40000;
const TIMEOUT_GUARDADO_MS = 90000;
async function fetchConLimite(url, options, ms){
  const ctrl = new AbortController();
  const reloj = setTimeout(() => ctrl.abort(), ms);
  try{
    return await fetch(url, Object.assign({}, options || {}, {signal: ctrl.signal}));
  }finally{
    clearTimeout(reloj);
  }
}

/* ===== Peso de las fotos =====
   Antes se guardaban a 1400-1600 px con calidad 0.85. En pantalla no se nota
   la diferencia con 1200 px / 0.72, pero cada foto pesa menos de la mitad:
   se sube más rápido, se baja más rápido y ocupa menos en la planilla. */
const FOTO_ANCHO = 1200;
const FOTO_CALIDAD = 0.72;

const storageAdapter = {
  async get(key, shared){
    if(hasCloudBackend){
      const res = await fetchConLimite(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent(key)}`, null, TIMEOUT_LECTURA_MS);
      const data = await res.json();
      if(data && !data.error && data.value !== undefined) return data;
      return null;
    }
    const raw = localStorage.getItem('geofleet_v1_'+key);
    return raw ? {key, value: raw, shared: !!shared} : null;
  },
  async set(key, value, shared){
    if(hasCloudBackend){
      try{
        const res = await fetchConLimite(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'set', key, value })
        }, TIMEOUT_GUARDADO_MS);
        return await res.json();
      }catch(e){ console.error('Error guardando', key, e); return null; }
    }
    try{ localStorage.setItem('geofleet_v1_'+key, value); return {key, value, shared: !!shared}; }
    catch(e){ console.error('Error guardando localmente', key, e); return null; }
  }
};

let customContratoTypes = [];

/* ===== Carga de datos combinada =====
   Antes, arrancar la app hacía 4 pedidos separados a Apps Script, uno detrás
   de otro (vehiculos, perfil, customDocTypes, customContratoTypes). Ahora se
   guardan y se leen todos juntos bajo una sola clave ("appData"), así que
   arrancar la app necesita un único viaje al servidor en vez de cuatro.
   Si todavía no existe esa clave combinada (por ejemplo, la primera vez que
   se abre esta versión nueva), se migran automáticamente los datos viejos
   guardados en las 4 claves separadas, y se guarda ya combinado para la
   próxima vez. */
async function loadAppData(){
  const combined = await storageAdapter.get('appData', false);
  if(combined){
    const d = JSON.parse(combined.value);
    vehiculos = d.vehiculos || [];
    if(d.perfil) perfil = d.perfil;
    customDocTypes = d.customDocTypes || [];
    customContratoTypes = d.customContratoTypes || [];
    return;
  }
  // Migración: todavía no existe "appData", se buscan las 4 claves viejas
  // en paralelo (más rápido que una detrás de otra) y se combinan.
  const [rv, rp, rd, rc] = await Promise.all([
    storageAdapter.get('vehiculos', false),
    storageAdapter.get('perfil', false),
    storageAdapter.get('customDocTypes', false),
    storageAdapter.get('customContratoTypes', false)
  ]);
  vehiculos = rv ? JSON.parse(rv.value) : [];
  if(rp) perfil = JSON.parse(rp.value);
  if(rd) customDocTypes = JSON.parse(rd.value);
  if(rc) customContratoTypes = JSON.parse(rc.value);
  await saveAppData();
}

/* ===== Copia local para carga instantánea =====
   Además de guardar en la nube, se guarda una copia en el propio dispositivo
   (localStorage). La próxima vez que se abra la app EN ESE MISMO dispositivo,
   se muestra esa copia al instante (sin esperar a Apps Script) mientras se
   trae la versión actualizada de fondo. Si tarda o falla la conexión, el
   usuario igual ve sus camionetas en vez de una pantalla vacía o en blanco. */
const APP_CACHE_KEY = 'geofleet_cache_v1';

function readAppCache(){
  try{
    const raw = localStorage.getItem(APP_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function writeAppCache(){
  try{ localStorage.setItem(APP_CACHE_KEY, JSON.stringify({vehiculos, perfil, customDocTypes, customContratoTypes})); }
  catch(e){ console.error('Error guardando copia local', e); }
}

function applyAppData(d){
  vehiculos = d.vehiculos || [];
  if(d.perfil) perfil = d.perfil;
  customDocTypes = d.customDocTypes || [];
  customContratoTypes = d.customContratoTypes || [];
}

async function saveAppData(){
  try{ await storageAdapter.set('appData', JSON.stringify({vehiculos, perfil, customDocTypes, customContratoTypes}), false); }
  catch(e){ console.error('Error guardando appData', e); }
  writeAppCache();
}

init();
async function init(){
  // 0) Mientras no haya nada para mostrar (ni copia local ni respuesta de la
  // nube), se avisa que está cargando en vez de dejar la lista vacía. Sin
  // esto, en una red móvil lenta la pantalla se ve en blanco varios segundos
  // y parece que la app no anda.
  const vehListEl = document.getElementById('vehList');
  if(vehListEl) vehListEl.innerHTML = '<div style="color:#9AA6B2; font-size:12.5px; padding:10px 4px;">Cargando camionetas…</div>';

  // 1) Si hay una copia guardada en este dispositivo, se muestra ya mismo.
  const cached = readAppCache();
  if(cached){
    applyAppData(cached);
    applyPerfilUI();
    renderVehList();
    const note = document.getElementById('storageNote');
    if(note) note.textContent = 'Mostrando datos guardados en este dispositivo. Actualizando…';
  }

  // 2) En paralelo (o si no había copia local), se trae la versión más
  // reciente de la nube y se refresca la pantalla cuando llega.
  try{
    await loadAppData();
    writeAppCache();
    applyPerfilUI();
    renderVehList();
    const note = document.getElementById('storageNote');
    if(note){
      note.textContent = usingLocalFallback
        ? 'Guardado localmente en este navegador (no en la nube). Si cambiás de compu o de navegador, no vas a ver estos datos.'
        : 'Los datos se guardan en la planilla compartida de Geofleet.';
    }
  }catch(e){
    console.error('Error cargando datos', e);
    if(cached){
      // Ya se está mostrando la copia local: se avisa pero no se tapa la pantalla.
      const note = document.getElementById('storageNote');
      if(note) note.textContent = 'No se pudo actualizar desde la nube. Mostrando la última versión guardada en este dispositivo.';
    }else{
      showLoadError();
    }
  }
}

function showLoadError(){
  const main = document.getElementById('main');
  if(main){
    main.innerHTML = `<div class="empty-state">
      <h2>No se pudo conectar</h2>
      <p>Revisá tu conexión a internet (wifi o datos móviles) e intentá de nuevo. Si el problema sigue, probá cerrar y volver a abrir la app.</p>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="location.reload()">Reintentar</button>
    </div>`;
  }
  // El mensaje también se pone acá arriba, en la lista de camionetas, porque
  // en el celular el panel principal (de arriba) queda debajo del scroll y
  // el aviso pasaba desapercibido: parecía que la app no cargaba nada.
  const vehListEl = document.getElementById('vehList');
  if(vehListEl){
    vehListEl.innerHTML = `<div style="color:#E8A55C; font-size:12.5px; padding:10px 4px; line-height:1.5;">
      ⚠️ No se pudo conectar.<br>
      <a href="#" onclick="location.reload();return false;" style="color:#fff; text-decoration:underline;">Tocá para reintentar</a>
    </div>`;
  }
  const note = document.getElementById('storageNote');
  if(note) note.textContent = 'No se pudo conectar. Tocá "Reintentar" arriba.';
}

  // Traer la ficha puede tardar (fotos y PDFs). Se avisa en vez de dejar la
  // pantalla congelada sin explicación.
  renderVehList();
  const mainEl = document.getElementById('main');
  if(mainEl){
    mainEl.innerHTML = `<div class="empty-state">
      <h2>Abriendo la ficha de ${patente}</h2>
      <p>Traemos los datos, las fotos y los archivos guardados. Con datos móviles puede tardar unos segundos.</p>
    </div>`;
  }
  try{
    const r = await storageAdapter.get(key, false);
    if(r){ currentData = JSON.parse(r.value); } else { currentData = defaultFicha(); wasNew = true; }
  }catch(e){
    // OJO: antes, si fallaba la red acá, se armaba una ficha vacía y se
    // guardaba encima de la real, borrando todo lo cargado. Ahora se corta.
    console.error('No se pudo traer la ficha', e);
    current = null;
    renderVehList();
    if(mainEl){
      mainEl.innerHTML = `<div class="empty-state">
        <h2>No se pudo abrir ${patente}</h2>
        <p>Se cortó la conexión antes de traer la ficha. Los datos siguen guardados: revisá la señal y volvé a tocar la camioneta.</p>
        <button class="btn btn-primary" style="margin-top:14px;" onclick="selectVehicle('${patente}')">Reintentar</button>

    }
    return;
  }
  if(!currentData.seguros) currentData.seguros = {libreDeuda:{}, certificado:{}, poliza:{}};
  if(!currentData.contratos) currentData.contratos = [];
  if(!currentData.siniestros) currentData.siniestros = [];
  if(!currentData.historial) currentData.historial = [];
  if(wasNew){ logHistorial('Ficha de la camioneta creada'); await saveCurrentFicha(); }
  renderVehList(); renderMain();
}

/* ---------- ARCHIVOS: helpers compartidos (fotos + PDF) ---------- */
function isPdfFile(file){ return file.type === 'application/pdf' || /\.pdf$/i.test(file.name||''); }
function readAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function resizeImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleUpload(file, maxW, quality){
  if(!file) return null;
  let dataUrl, fileType;
  const ext = fileExt(file.name);
  if(isPdfFile(file)){
    if(file.size > 6000*1024){ alert('El PDF pesa '+Math.round(file.size/1024)+' KB. Subí uno de menos de 6 MB (o convertilo a foto) para que el sistema no se sature.'); return null; }
    dataUrl = await readAsDataURL(file); fileType = 'pdf';
  } else if(isOfficeFile(file)){
    if(file.size > 6000*1024){ alert('El archivo pesa '+Math.round(file.size/1024)+' KB. Subí uno de menos de 6 MB para que el sistema no se sature.'); return null; }
    dataUrl = await readAsDataURL(file); fileType = 'office';
  } else {
    dataUrl = await resizeImage(file, maxW||FOTO_ANCHO, quality||FOTO_CALIDAD); fileType = 'image';
  }

  // Con Drive activo: se sube el archivo y se guarda solo su ID (liviano).
  if(USAR_DRIVE && hasCloudBackend){
    const up = await subirArchivoADrive(dataUrl, file.name);
    if(up && up.fileId){ return {fileId: up.fileId, fileType, fileName:file.name, ext}; }
    // Si la subida falla, no se pierde el archivo: se guarda como antes (base64).
    console.warn('Drive falló, se guarda el archivo en la planilla (base64).');
  }
  return {fileData: dataUrl, fileType, fileName:file.name, ext};
}
function fileThumb(item, cssClass){
  if(!item || (!item.fileData && !item.fileId)) return `<div class="${cssClass}"></div>`;
  const i = regFile(item);
  if(item.fileType==='pdf') return `<a class="file-tile ${cssClass==='doc-thumb'?'pdf-thumb':cssClass}" onclick="openReg(${i})">PDF</a>`;
  if(item.fileType==='office'){ const k=officeKind(item.ext||item.fileName); return `<div class="office-tile" onclick="openReg(${i})"><span class="ic">${k==='excel'?'📊':'📄'}</span>${k==='excel'?'EXCEL':'WORD'}</div>`; }
  return `<img class="file-tile ${cssClass}" src="${fileUrl(item,'img')}" data-fid="${item.fileId||''}" onerror="imgFallback(this)" loading="lazy" decoding="async" onclick="openReg(${i})">`;
}

/* ---------- ARCHIVOS: tipos admitidos + visor interno ---------- */
// Todos los casilleros aceptan foto, PDF, Word y Excel.
const ACCEPT_ARCHIVOS = 'image/*,application/pdf,.doc,.docx,.xls,.xlsx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function fileExt(name){ const m = /\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
function isOfficeFile(file){
  const ext = fileExt(file.name);
  return ['doc','docx','xls','xlsx'].includes(ext) || /officedocument|msword|ms-excel/.test(file.type||'');
}
function officeKind(nameOrExt){
  const e = (nameOrExt||'').toLowerCase();
  if(/(xls|excel|sheet)/.test(e)) return 'excel';
  return 'word';
}

// Registro liviano de archivos para el visor: guarda solo un índice en cada
// tile en vez de meter el base64 (enorme) dentro del atributo onclick.
let __fileReg = [];
function regFile(f){ if(!f || (!f.fileData && !f.fileId)) return -1; __fileReg.push(f); return __fileReg.length-1; }
function openReg(i){ const f=__fileReg[i]; if(f) openFilePreview(f); }

// Genera un tile clickeable uniforme (foto / PDF / Word / Excel) para usar
// dentro de las grillas .photo-grid de los formularios.
function previewTile(f){
  const i = regFile(f);
  if(f.fileType==='office'){ const k=officeKind(f.ext||f.fileName||f.desc); return `<div class="office-tile" onclick="openReg(${i})"><span class="ic">${k==='excel'?'📊':'📄'}</span>${k==='excel'?'EXCEL':'WORD'}</div>`; }
  if(f.fileType==='pdf'){ return `<a class="file-tile pdf-tile" onclick="openReg(${i})">PDF</a>`; }
  return `<img class="file-tile" src="${fileUrl(f,'img')}" data-fid="${f.fileId||''}" onerror="imgFallback(this)" loading="lazy" decoding="async" onclick="openReg(${i})">`;
}

function openFilePreview(f){
  const name = f.fileName || f.desc || 'Archivo';
  let inner;
  if(f.fileType==='image'){
    inner = `<img src="${fileUrl(f,'imgBig')}" data-fid="${f.fileId||''}" onerror="imgFallback(this)" style="max-width:100%; max-height:72vh; display:block; margin:0 auto; border-radius:6px;">`;
  } else if(f.fileType==='pdf'){
    inner = `<iframe src="${fileUrl(f,'pdf')}" style="width:100%; height:72vh; border:1px solid var(--line); border-radius:6px;"></iframe>`;
  } else {
    // Word / Excel: el navegador no los muestra; se ofrece descargar/abrir.
    const k = officeKind(f.ext || f.fileName || name);
    inner = `<div style="text-align:center; padding:32px 14px;">
      <div style="font-size:46px; margin-bottom:10px;">${k==='excel'?'📊':'📄'}</div>
      <div style="font-weight:600; margin-bottom:4px; word-break:break-word;">${name}</div>
      <div style="color:var(--muted); font-size:12.5px; margin-bottom:18px;">Los archivos de Word y Excel no se pueden ver dentro del navegador.</div>
      <a class="btn btn-primary" href="${fileUrl(f,'download')}" target="_blank" ${f.fileId?'':`download="${name}"`}>⭳ Descargar / Abrir</a>
    </div>`;
  }
  document.getElementById('filePreviewTitle').textContent = name;
  document.getElementById('filePreviewBody').innerHTML = inner;
  document.getElementById('filePreviewOverlay').style.display = 'flex';
}
function closeFilePreview(){
  document.getElementById('filePreviewOverlay').style.display = 'none';
  document.getElementById('filePreviewBody').innerHTML = '';
}

function seguroCard(key, seg){
  const st = seguroStatus(seg);
  const tiene = !!(seg.fileData || seg.fileId);

  if(!tiene){

function seguroStatus(seg){
  if(!seg || (!seg.fileData && !seg.fileId)) return {cls:'gray', label:'Sin cargar'};
  if(!seg.vencimiento) return {cls:'green', label:'Cargado'};
  const days = Math.ceil((new Date(seg.vencimiento) - new Date()) / 86400000);
  if(days < 0) return {cls:'red', label:'Vencido'};
  return {cls:'green', label:'Vigente'};
}
async function onSeguroFile(key, input){
  if(!input.files[0]) return;
  const res = await handleUpload(input.files[0], FOTO_ANCHO, FOTO_CALIDAD);
  if(!res) return;
  if(!currentData.seguros[key]) currentData.seguros[key] = {};
  // Se reemplaza limpiamente (borra el archivo anterior de Drive si había).
  const previoId = currentData.seguros[key].fileId;
  if(previoId && previoId !== res.fileId) borrarArchivoDeDrive(previoId);
  currentData.seguros[key].fileData = res.fileData || null;
  currentData.seguros[key].fileId = res.fileId || null;
  currentData.seguros[key].fileType = res.fileType;
  currentData.seguros[key].fileName = res.fileName;
  currentData.seguros[key].ext = res.ext;
  logHistorial(SEG_LABELS[key]+' actualizado ('+res.fileType+')');
  await saveCurrentFicha();
  renderTab();
}

async function addFoto(){

  const desc = document.getElementById('fotoDesc').value;
  const uploaded = await uploadMultiple(fileInput.files, 1600, 0.85);
  if(!uploaded.length) return;
  uploaded.forEach((res,i)=>{
    currentData.fotos.push({id: cryptoId(), desc: uploaded.length>1 ? (desc?`${desc} (${i+1})`:'') : desc, fileData: res.fileData, fileType: res.fileType, fileName: res.fileName, ext: res.ext, fecha: todayISO()});

async function addFotosFolder(input){
  const files = Array.from(input.files || []).filter(f => f.type.startsWith('image/') || isPdfFile(f) || isOfficeFile(f));
  if(files.length===0){ alert('No se encontraron imágenes, PDFs ni documentos en esa carpeta.'); return; }
  let added = 0;
  for(const f of files){
    try{
      const res = await handleUpload(f, FOTO_ANCHO, FOTO_CALIDAD);
      if(res){ currentData.fotos.push({id: cryptoId(), desc: f.name, fileData: res.fileData, fileType: res.fileType, fileName: res.fileName, ext: res.ext, fecha: todayISO()}); added++; }

  }
  logHistorial(added+' foto(s)/archivo(s) cargados desde carpeta');

function regRow(r){
  let periodo = '';

    periodo = formatDate(r.fechaInicio) + ' → ' + (r.enCurso ? '<b style="color:#946200;">continúa alquilada</b>' : (r.fechaFin?formatDate(r.fechaFin):'—'));

    if(r.fotos && r.fotos.length) detalle += ' · 📷 '+r.fotos.length;

    if(r.archivos && r.archivos.length) detalle += ' · 📎 '+r.archivos.length;

    <td><span class="tag tag-${r.tipo==='uso'?'uso':r.tipo==='mantenimiento'?'mant':'inc'}">${tipoLabel(r.tipo)}</span></td>

function collectRegForm(){
  const tipo = document.getElementById('regTipo').value;
  if(tipo==='uso'){
    return { tipo, cliente:document.getElementById('regCliente').value, cuit:document.getElementById('regCuit').value, rubro:document.getElementById('regRubro').value,
      fechaInicio:document.getElementById('regFInicio').value,
      enCurso:document.getElementById('regEnCurso').checked, fechaFin:document.getElementById('regEnCurso').checked?'':document.getElementById('regFFin').value,
      kmInicio:document.getElementById('regKmInicio').value, kmFin:document.getElementById('regKmFin').value, notas:document.getElementById('regNotas').value,

  if(tipo==='mantenimiento'){ base.fotos = [...regMantFotos]; base.archivos = [...regMantArchivos]; }

async function addRegistro(){
  const data = collectRegForm();
  if(data.tipo==='uso' && !data.cliente){ alert('Indicá el cliente.'); return; }
  if(data.tipo!=='uso' && !data.detalle){ alert('Cargá un detalle.'); return; }
  currentData.registros.push({id: cryptoId(), ...data});
  logHistorial('Registro de '+tipoLabel(data.tipo)+' agregado');
  regMantFotos=[]; regMantArchivos=[]; regAlqChecklist=null; regAlqFotos=[];
  await saveCurrentFicha(); renderTab();
}

function cancelRegEdit(){ editingRegId = null; regMantFotos=[]; regMantArchivos=[]; regAlqChecklist=null; regAlqFotos=[]; renderTab(); }
async function saveRegEdit(){
  const data = collectRegForm();
  const idx = currentData.registros.findIndex(r=>r.id===editingRegId);
  reconciliarBorrado(currentData.registros[idx], data);
  currentData.registros[idx] = {id: editingRegId, ...data};
  logHistorial('Registro de '+tipoLabel(data.tipo)+' editado');
  editingRegId = null; regMantFotos=[]; regMantArchivos=[]; regAlqChecklist=null; regAlqFotos=[];
  await saveCurrentFicha(); renderTab();
}
function delRegistro(id){
  if(!confirm('¿Eliminar este registro?')) return;
  const r = currentData.registros.find(x=>x.id===id);

  currentData.registros = currentData.registros.filter(x=>x.id!==id);
  logHistorial('Registro de '+tipoLabel(r?r.tipo:'')+' eliminado');
  saveCurrentFicha(); renderTab();

function formatDateTime(iso){

}

function simpleHash(str){
  let h1 = 0, h2 = 0;
  for(let i=0;i<str.length;i++){
    h1 = (Math.imul(31,h1) + str.charCodeAt(i))|0;
    h2 = (Math.imul(17,h2) + str.charCodeAt(i)*7)|0;
  }
  return ((h1>>>0).toString(16)+(h2>>>0).toString(16)).toUpperCase().slice(0,10);
}

// Al exportar, los archivos que están en Drive no traen el contenido (fileData).
// Acá se guardan los bytes que se bajan una sola vez desde el backend.
let __pdfBytes = {};
function tieneArchivo(x){ return !!(x && (x.fileData || x.fileId)); }
function bytesDe(item){
  if(!item) return null;
  if(item.fileData) return item.fileData;
  if(item.fileId && __pdfBytes[item.fileId]) return __pdfBytes[item.fileId];
  return null;
}
// Recorre las fichas, junta los fileId que faltan y baja su contenido (una vez cada uno).
async function precargarArchivosPDF(fichas){
  const ids = new Set();
  const add = f => { if(f && f.fileId && !f.fileData && !__pdfBytes[f.fileId]) ids.add(f.fileId); };
  for(const ficha of fichas){
    (ficha.fotos||[]).forEach(add);
    Object.values(ficha.seguros||{}).forEach(add);
    (ficha.documentos||[]).forEach(d=>{ add(d); (d.extraFotos||[]).forEach(add); });
    (ficha.contratos||[]).forEach(d=>{ add(d); (d.extraFotos||[]).forEach(add); });
    (ficha.siniestros||[]).forEach(s=>{ (s.fotos||[]).forEach(add); (s.comprobantesPago||[]).forEach(add); (s.copiasInfraccion||[]).forEach(add); });
    (ficha.registros||[]).forEach(r=>{ add(r.checklist); (r.fotos||[]).forEach(add); (r.archivos||[]).forEach(add); });
  }
  for(const id of ids){
    try{
      const res = await fetchConLimite(`${APPS_SCRIPT_URL}?action=getFile&fileId=${encodeURIComponent(id)}`, null, TIMEOUT_GUARDADO_MS);
      const data = await res.json();
      if(data && data.fileData) __pdfBytes[id] = data.fileData;
    }catch(e){ console.error('No se pudo precargar un archivo para el PDF', id, e); }
  }
}

function fitImage(doc, item, x, y, maxW, maxH){
  if(!item || item.fileType==='pdf') return {w:0,h:0,drawn:false};
  if(item.fileType==='office'){
    // Word / Excel: no se pueden dibujar; se deja constancia por nombre.
    const k = officeKind(item.ext||item.fileName);
    doc.setDrawColor(214,218,225); doc.setFillColor(238,243,248);
    doc.roundedRect(x, y, maxW, maxH, 4, 4, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(Math.min(8, maxW/7)); doc.setTextColor(44,110,155);
    doc.text(k==='excel'?'EXCEL':'WORD', x+maxW/2, y+maxH/2-3, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(5);
    const nm = doc.splitTextToSize(item.fileName||'archivo', maxW-6);
    doc.text(nm.slice(0,2), x+maxW/2, y+maxH/2+6, {align:'center'});
    return {w:maxW,h:maxH,drawn:true};
  }
  const data = bytesDe(item);
  if(!data) return {w:0,h:0,drawn:false};
  try{
    const props = doc.getImageProperties(data);
    const ratio = Math.min(maxW/props.width, maxH/props.height);
    const w = props.width*ratio, h = props.height*ratio;
    const ox = x + (maxW-w)/2, oy = y + (maxH-h)/2;
    doc.addImage(data, props.fileType, ox, oy, w, h);
    return {w,h,drawn:true};
  }catch(e){ return {w:0,h:0,drawn:false}; }
}

async function exportarPDF(){
  const selected = Array.from(document.querySelectorAll('.expVehCheck:checked')).map(cb=>cb.value);
  if(selected.length===0){ alert('Elegí al menos una camioneta.'); return; }
  const incl = {
    datos: document.getElementById('expDatos').checked,
    seguros: document.getElementById('expSeguros').checked,
    docs: document.getElementById('expDocs').checked,
    contratos: document.getElementById('expContratos').checked,
    siniestros: document.getElementById('expSiniestros').checked,
    fotos: document.getElementById('expFotos').checked,
    registros: document.getElementById('expRegistros').checked,
    historial: document.getElementById('expHistorial').checked,
  };
  closeOverlay('expOverlay');

  // Recién acá se descargan jsPDF y pdf-lib (no al abrir la app).
  try{
    await cargarLibreriasPDF();
  }catch(e){
    alert('No se pudieron descargar las herramientas para armar el PDF. Revisá la conexión e intentá de nuevo.');
    return;
  }
  const { jsPDF } = window.jspdf;

  // Se bajan (una sola vez) los archivos que viven en Drive, para poder
  // incrustarlos en el PDF. Los archivos viejos (base64) no necesitan esto.
  __pdfBytes = {};
  if(USAR_DRIVE && hasCloudBackend){
    const fichasPre = [];
    for(const patente of selected){
      let ficha;
      if(patente===current && currentData){ ficha = currentData; }
      else{ try{ const r = await storageAdapter.get('ficha:'+patente, false); ficha = r ? JSON.parse(r.value) : null; }catch(e){ ficha = null; } }
      if(ficha) fichasPre.push(ficha);
    }
    try{ await precargarArchivosPDF(fichasPre); }catch(e){ console.error('Precarga de archivos incompleta', e); }
  }

  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 42;
  let y = margin;

  /* Acá se acumulan todos los PDF adjuntos (pólizas, siniestros, etc.) que
     se encuentran mientras se arma el reporte, para incluirlos de verdad
     como páginas al final del PDF exportado (Anexo). */
  const adjuntosPdf = [];
  function registrarAdjuntoPdf(item, meta){
    if(!item) return;
    const data = bytesDe(item);
    if(!data) return;
    adjuntosPdf.push({
      fileData: data,
      fileName: item.fileName || 'documento.pdf',
      patente: (meta && meta.patente) || '',
      label: (meta && meta.label) || 'Documento adjunto'
    });
  }

  function ensureSpace(h){ if(y + h > pageH - 60){ doc.addPage(); y = margin; } }
  function heading(text, size){
    size = size||14;
    ensureSpace(size*1.9);
    doc.setFillColor(243,245,247); doc.rect(margin-4, y-size*0.85, pageW-margin*2+8, size*1.65, 'F');
    doc.setFillColor(232,89,12); doc.rect(margin-4, y-size*0.85, 3, size*1.65, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(size); doc.setTextColor(22,32,42);
    doc.text(text, margin+8, y); y += size*1.55;
  }
  function writeText(text, x, maxWidth, opts){
    opts = opts||{};
    const size = opts.size||10;
    doc.setFont(opts.font||'helvetica', opts.style||'normal'); doc.setFontSize(size);
    const col = opts.color||[90,98,108]; doc.setTextColor(col[0],col[1],col[2]);
    const lines = doc.splitTextToSize(text||'', maxWidth);
    ensureSpace(lines.length*(size*1.25)+4);
    doc.text(lines, x, y);
    y += lines.length*(size*1.25);
  }
  function line(){ ensureSpace(14); doc.setDrawColor(214,218,225); doc.line(margin,y,pageW-margin,y); y += 14; }
  function thumbRow(items, xStart, meta){
    if(!items || !items.length) return;
    const tw=54, th=54, gap=8;
    let tx = xStart, used = false;
    for(const it of items){
      if(tx + tw > pageW - margin){ tx = xStart; y += th + 8; }
      ensureSpace(th+12);
      if(it.fileType==='pdf'){
        doc.setDrawColor(214,218,225); doc.setFillColor(243,233,227);
        doc.roundedRect(tx, y, tw, th, 4, 4, 'FD');
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(178,58,27);
        doc.text('PDF', tx+tw/2, y+th/2+3-4, {align:'center'});
        doc.setFont('helvetica','normal'); doc.setFontSize(6);
        doc.text('Ver Anexo', tx+tw/2, y+th/2+8, {align:'center'});
        registrarAdjuntoPdf(it, meta);
      } else if(it.fileType==='office'){
        // Word / Excel no se pueden convertir en hojas: se listan por nombre.
        const k = officeKind(it.ext||it.fileName);
        doc.setDrawColor(214,218,225); doc.setFillColor(238,243,248);
        doc.roundedRect(tx, y, tw, th, 4, 4, 'FD');

        doc.setFont('helvetica','normal'); doc.setFontSize(5);
        const nm = doc.splitTextToSize(it.fileName||'archivo', tw-6);
        doc.text(nm.slice(0,2), tx+tw/2, y+th/2+6, {align:'center'});
      } else {
        fitImage(doc, it, tx, y, tw, th);
        doc.setDrawColor(214,218,225); doc.rect(tx, y, tw, th);
      }
      tx += tw + gap; used = true;
    }
    if(used) y += th + 12;
  }

      heading('Historial de modificaciones', 12.5);
      const hist = [...ficha.historial].sort((a,b)=> b.fecha.localeCompare(a.fecha));
      if(hist.length===0) writeText('Sin movimientos registrados.', margin, pageW-margin*2);
      for(const h of hist){
        ensureSpace(14);
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,98,108);
        doc.text(formatDateTime(h.fecha), margin, y);
        doc.setTextColor(40,40,40);
        doc.text(h.accion, margin+120, y, {maxWidth: pageW-margin*2-120});
        y += 13;
      }
    }
  }

  // Sello de validación
  ensureSpace(90);
  y += 10;
  const stampY = y;
  doc.setDrawColor(232,89,12); doc.setLineWidth(1.2);
  doc.roundedRect(margin, stampY, pageW-margin*2, 66, 6, 6);
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(22,32,42);
  doc.text('Documento validado por el sistema de trazabilidad', margin+14, stampY+20);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,98,108);
  doc.text(`${perfil.empresa || 'Geofleet Rental y Servicios S.A.S'}${perfil.cuit?('  ·  CUIT '+perfil.cuit):''}`, margin+14, stampY+34);
  const codigo = simpleHash(selected.join(',')+'|'+new Date().toISOString()+'|'+(perfil.cuit||''));
  doc.text(`Generado: ${new Date().toLocaleString('es-AR')}   ·   Código de verificación: ${codigo}`, margin+14, stampY+47);
  doc.setFontSize(7.5); doc.setTextColor(140,148,156);
  doc.text('Este sello certifica que el documento fue generado desde el sistema interno de la empresa en la fecha indicada. No constituye una firma digital con registro legal.', margin+14, stampY+59, {maxWidth: pageW-margin*2-28});

  // Pie de página profesional en todas las hojas del reporte principal
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setDrawColor(224,227,231); doc.setLineWidth(0.7);
    doc.line(margin, pageH-38, pageW-margin, pageH-38);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,148,156);
    doc.text(perfil.empresa || 'Geofleet Rental y Servicios S.A.S', margin, pageH-24);
    doc.text(`Página ${p} de ${totalPages}`, pageW-margin, pageH-24, {align:'right'});
    doc.setFontSize(7.5);
    doc.text('Documento de uso interno — generado por el sistema de trazabilidad de flota', margin, pageH-13);
  }

  const fileName = selected.length===1 ? `trazabilidad-${selected[0]}.pdf` : `trazabilidad-flota-${todayISO()}.pdf`;

  // Si no hay PDF adjuntos reales para anexar, se descarga tal cual (comportamiento anterior).
  if(adjuntosPdf.length === 0 || typeof PDFLib === 'undefined'){
    doc.save(fileName);
    return;
  }

  // Hay archivos PDF cargados dentro de la ficha (pólizas, siniestros, etc.):
  // se anexan de verdad al final, con su contenido real y legible, no solo el nombre.
  try{
    const mainBytes = doc.output('arraybuffer');
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const finalPdf = await PDFDocument.load(mainBytes);
    const font = await finalPdf.embedFont(StandardFonts.HelveticaBold);
    const fontN = await finalPdf.embedFont(StandardFonts.Helvetica);

    // Portada del anexo
    const coverW = 595.28, coverH = 841.89; // A4 en puntos
    const cover = finalPdf.addPage([coverW, coverH]);
    cover.drawText('Anexo: documentos PDF adjuntos', {x:42, y: coverH-70, size:16, font, color: rgb(0.09,0.13,0.16)});
    cover.drawText('A continuación se incluyen, con su contenido completo, los archivos PDF', {x:42, y: coverH-96, size:9.5, font: fontN, color: rgb(0.35,0.38,0.42)});
    cover.drawText('que estaban cargados en la ficha (pólizas, siniestros, contratos, etc.).', {x:42, y: coverH-110, size:9.5, font: fontN, color: rgb(0.35,0.38,0.42)});
    let ty = coverH-150;
    adjuntosPdf.forEach((a,i)=>{
      if(ty < 60){ return; } // evita desbordar la portada; el documento igual se anexa más abajo
      cover.drawText(`${i+1}. ${a.patente} — ${a.label} — ${a.fileName}`, {x:42, y: ty, size:9.5, font: fontN, color: rgb(0.16,0.19,0.22)});
      ty -= 16;
    });

    for(const a of adjuntosPdf){
      try{
        const base64 = (a.fileData.split(',')[1]) || a.fileData;
        const bytes = Uint8Array.from(atob(base64), c=>c.charCodeAt(0));
        const srcPdf = await PDFDocument.load(bytes, {ignoreEncryption:true});
        const titlePage = finalPdf.addPage([coverW, coverH]);
        titlePage.drawText(a.patente, {x:42, y: coverH-70, size:14, font, color: rgb(0.91,0.35,0.05)});
        titlePage.drawText(a.label, {x:42, y: coverH-92, size:12, font, color: rgb(0.09,0.13,0.16)});
        titlePage.drawText('Archivo: '+a.fileName, {x:42, y: coverH-112, size:9.5, font: fontN, color: rgb(0.35,0.38,0.42)});
        const copied = await finalPdf.copyPages(srcPdf, srcPdf.getPageIndices());
        copied.forEach(p=>finalPdf.addPage(p));
      }catch(errAdj){
        // Si un archivo adjunto puntual está dañado, no se cae todo el export: se avisa en una página y se sigue.
        const errPage = finalPdf.addPage([coverW, coverH]);
        errPage.drawText(a.patente+' — '+a.label, {x:42, y: coverH-70, size:13, font, color: rgb(0.75,0.22,0.1)});
        errPage.drawText('No se pudo incluir este archivo ('+a.fileName+').', {x:42, y: coverH-94, size:10, font: fontN, color: rgb(0.35,0.38,0.42)});
        errPage.drawText('El archivo original puede estar dañado o no ser un PDF válido.', {x:42, y: coverH-110, size:9, font: fontN, color: rgb(0.55,0.58,0.62)});
      }
    }

    const finalBytes = await finalPdf.save();
    const blob = new Blob([finalBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(errMerge){
    console.error('Error anexando PDFs, se descarga el reporte sin anexo:', errMerge);
    doc.save(fileName);
  }
}

/* ---------- UTILS ---------- */
function cryptoId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function formatDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
</script>
