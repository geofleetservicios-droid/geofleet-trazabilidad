<style>
  :root{
    --asphalt:#16202A; --panel:#FFFFFF; --bg:#E9EBEE; --line:#D6DAE1; --text:#1A202C; --muted:#6B7684;
    --orange:#E8590C; --orange-dim:#FCE3D3; --green:#2F7D4F; --green-dim:#E1F3E7;
    --red:#C0392B; --red-dim:#FBE2DF; --gray-dim:#EEF0F2; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{display:flex; min-height:100vh;}
  .sidebar{width:280px; flex-shrink:0; background:var(--asphalt); color:#fff; display:flex; flex-direction:column; padding:22px 16px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:18px; padding:0 4px;}
  .brand-mark{width:38px; height:38px; border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; font-family:'Space Grotesk',sans-serif; color:var(--asphalt); flex-shrink:0; overflow:hidden;}
  .brand-mark img{width:100%; height:100%; object-fit:contain;}
  .brand-text{font-size:12.5px; line-height:1.25;}
  .brand-text b{display:block; font-size:13.5px;}
  .brand-text span{color:#9AA6B2; font-size:11px;}
  .side-btn{background:transparent; border:1.5px solid #34414F; color:#C7D0DA; padding:9px 11px; border-radius:var(--radius); font-size:12.5px; cursor:pointer; margin-bottom:8px; text-align:left; font-weight:500; transition:.15s; width:100%; display:flex; align-items:center; gap:7px;}
  .side-btn:hover{border-color:var(--orange); color:#fff; background:#1D2A38;}
  .side-btn.dashed{border-style:dashed;}
  .veh-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-top:8px;}
  .veh-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer; transition:.12s;}
  .veh-item:hover{background:#1D2A38;}
  .veh-item:hover .veh-del{opacity:1;}
  .veh-item.active{background:var(--orange-dim);}
  .veh-item.active .plate-mini{background:var(--orange); color:#fff;}
  .veh-item.active .veh-name{color:var(--asphalt);}
  .veh-item.active .veh-sub{color:#8A5A38;}
  .veh-del{opacity:0; transition:.12s; margin-left:auto; flex-shrink:0; background:transparent; border:none; color:#8B96A3; font-size:14px; padding:4px 6px; border-radius:6px; cursor:pointer; line-height:1;}
  .veh-del:hover{background:var(--red-dim); color:var(--red);}
  .plate-mini{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; background:#2C3B4C; color:#D6DEE6; padding:4px 6px; border-radius:4px; letter-spacing:0.5px; flex-shrink:0;}
  .veh-name{font-size:13.5px; font-weight:500; color:#E4E9EE;}
  .veh-sub{font-size:11px; color:#8B96A3;}
  .veh-sub.vendido{color:#E8A55C;}
  .sidebar-foot{font-size:11px; color:#6B7684; padding:10px 4px 0; border-top:1px solid #263140; margin-top:14px;}
  .main{flex:1; padding:26px 32px; overflow-y:auto;}
  .empty-state{max-width:420px; margin:60px auto; text-align:center; color:var(--muted);}
  .empty-state h2{color:var(--text); margin-bottom:8px;}
  .top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .plate-badge{display:inline-flex; align-items:stretch; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.15); border:2px solid var(--asphalt);}
  .plate-badge .strip{background:var(--asphalt); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 6px; writing-mode:vertical-rl;}
  .plate-badge .num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:22px; letter-spacing:2px; background:#fff; padding:6px 14px; color:var(--asphalt);}
  .veh-title-block{display:flex; align-items:center; gap:14px;}
  .veh-title-text b{display:block; font-size:15px;}
  .veh-title-text span{color:var(--muted); font-size:12.5px;}
  .badge-vendido{display:inline-block; font-size:10.5px; font-weight:700; background:var(--red-dim); color:var(--red); padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle;}
  .btn{border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:7px;}
  .btn-primary{background:var(--orange); color:#fff;}
  .btn-primary:hover{background:#CE4E0A;}
  .btn-ghost{background:#fff; color:var(--text); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--asphalt);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .tabs{display:flex; gap:4px; border-bottom:1.5px solid var(--line); margin-bottom:20px; flex-wrap:wrap;}
  .tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1.5px; transition:.12s; white-space:nowrap;}
  .tab.active{color:var(--asphalt); border-bottom-color:var(--orange);}
  .tab:hover{color:var(--asphalt);}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .panel + .panel{margin-top:14px;}
  label{font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:5px;}
  input[type=text], input[type=date], input[type=number], input[type=email], select, textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; font-family:inherit; background:#fbfbfc;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--orange); outline-offset:0; border-color:var(--orange);}
  .field{margin-bottom:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  textarea{resize:vertical; min-height:60px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-head h3{font-size:14.5px; margin:0;}
  .doc-card{display:flex; gap:12px; padding:12px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; align-items:flex-start;}
  .doc-thumb{width:64px; height:64px; border-radius:6px; object-fit:cover; background:#eee; flex-shrink:0; border:1px solid var(--line);}
  .pdf-thumb{width:64px; height:64px; border-radius:6px; background:#F3E9E3; color:#B23A1B; flex-shrink:0; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; text-decoration:none;}
  .doc-info{flex:1; min-width:0;}
  .doc-info .name{font-weight:600; font-size:13.5px;}
  .doc-info .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .status-chip{display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; margin-top:6px;}
  .status-ok{background:var(--green-dim); color:var(--green);}
  .status-warn{background:#FDF1DC; color:#946200;}
  .status-bad{background:var(--red-dim); color:var(--red);}
  .status-pos{background:var(--green-dim); color:var(--green);}
  .status-neg{background:var(--red-dim); color:var(--red);}
  .status-tram{background:#FDF1DC; color:#946200;}
  .doc-actions{display:flex; flex-direction:column; gap:6px;}
  .icon-btn{background:transparent; border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-size:11.5px; cursor:pointer; color:var(--muted);}
  .icon-btn:hover{border-color:var(--asphalt); color:var(--asphalt);}
  .icon-btn.danger:hover{border-color:var(--red); color:var(--red);}
  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
  .photo-item{position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .photo-item img{width:100%; height:100px; object-fit:cover; display:block;}
  .photo-item .pdf-tile{width:100%; height:100px; display:flex; align-items:center; justify-content:center; background:#F3E9E3; color:#B23A1B; font-weight:700; font-size:12px; text-decoration:none;}
  .photo-item .cap{font-size:10.5px; padding:5px 6px; background:#fff; color:var(--muted);}
  .photo-item .del{position:absolute; top:4px; right:4px; background:rgba(0,0,0,.55); color:#fff; border:none; width:20px; height:20px; border-radius:50%; font-size:12px; cursor:pointer; line-height:1;}
  .photo-item .edt{position:absolute; top:4px; right:28px; background:rgba(0,0,0,.55); color:#fff; border:none; width:20px; height:20px; border-radius:50%; font-size:11px; cursor:pointer; line-height:1;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1.5px solid var(--line);}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .tag{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:12px; text-transform:uppercase;}
  .tag-uso{background:#E4EDFB; color:#2A5DA6;}
  .tag-mant{background:#EAE6F8; color:#5B3EA6;}
  .tag-inc{background:var(--red-dim); color:var(--red);}
  .upload-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; padding-bottom:16px; border-bottom:1px dashed var(--line);}
  .upload-row .field{flex:1; min-width:130px; margin-bottom:0;}
  .file-btn{border:1.5px dashed #C6CDD6; border-radius:7px; padding:8px 12px; font-size:12.5px; color:var(--muted); cursor:pointer; text-align:center; background:#fbfbfc; white-space:nowrap;}
  .file-btn.has-file{border-color:var(--green); color:var(--green); background:var(--green-dim);}
  .muted-note{font-size:12px; color:var(--muted); margin-top:8px;}
  .empty-mini{font-size:12.5px; color:var(--muted); padding:16px; text-align:center;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}
  .dot-green{background:var(--green);}
  .dot-red{background:var(--red);}
  .dot-yellow{background:#D6A02A;}
  .dot-gray{background:#B8C0C9;}
  .seguro-card{border:1px solid var(--line); border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:8px;}
  .seguro-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:6px;}
  .seguro-head{display:flex; align-items:center; justify-content:space-between;}
  .seguro-head b{font-size:13px;}
  .seguro-thumb{width:100%; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:#f2f2f2;}
  .seguro-thumb-pdf{width:100%; height:80px; display:flex; align-items:center; justify-content:center; border-radius:6px; border:1px solid var(--line); background:#F3E9E3; color:#B23A1B; font-weight:700; font-size:12px; text-decoration:none;}
  .overlay{position:fixed; inset:0; background:rgba(16,22,29,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:#fff; border-radius:12px; padding:24px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;}
  .modal h3{margin-top:0;}
  .modal-close{float:right; background:none; border:none; font-size:18px; cursor:pointer; color:var(--muted); padding:4px 8px; line-height:1;}
  .modal-close:hover{color:var(--red);}
  .checkline{display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .checkline:last-child{border-bottom:none;}
  .logo-preview{width:56px; height:56px; border-radius:8px; object-fit:contain; border:1px solid var(--line); background:#f2f2f2;}
  .reader-banner{background:#16202A; color:#fff; padding:9px 16px; font-size:13px; display:flex; align-items:center; justify-content:space-between; border-radius:8px; margin-bottom:18px;}
  .reader-banner button{background:var(--orange); border:none; color:#fff; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:#3A4756; border-radius:8px;}
  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; flex-wrap:wrap; padding:14px;}
    .veh-list{flex-direction:row; flex-wrap:wrap; width:100%;}
    .grid2,.grid3,.seguro-grid{grid-template-columns:1fr;}
    .main{padding:18px;}
  }
</style>
</head>

</div>

const CONTRATO_TYPES_BASE = ['Contrato de locación','Constancia de CUIT','Constancia de inscripción AFIP','Orden de compra','Otro'];
let customDocTypes = [];
let customContratoTypes = [];

/* ===== Carga de datos combinada =====
   Antes, arrancar la app hacía 4 pedidos separados a Apps Script, uno detrás
   de otro (vehiculos, perfil, customDocTypes, customContratoTypes). Ahora se
   guardan y se leen todos juntos bajo una sola clave ("appData"), así que
   arrancar la app necesita un único viaje al servidor en vez de cuatro.
   Si todavía no existe esa clave combinada (por ejemplo, la primera vez que
   se abre esta versión nueva), se migran automáticamente los datos viejos
   guardados en las 4 claves separadas, y se guarda ya combinado para la
   próxima vez. */
async function loadAppData(){
  const combined = await storageAdapter.get('appData', false);
  if(combined){
    const d = JSON.parse(combined.value);
    vehiculos = d.vehiculos || [];
    if(d.perfil) perfil = d.perfil;
    customDocTypes = d.customDocTypes || [];
    customContratoTypes = d.customContratoTypes || [];
    return;
  }
  // Migración: todavía no existe "appData", se buscan las 4 claves viejas
  // en paralelo (más rápido que una detrás de otra) y se combinan.
  const [rv, rp, rd, rc] = await Promise.all([
    storageAdapter.get('vehiculos', false),
    storageAdapter.get('perfil', false),
    storageAdapter.get('customDocTypes', false),
    storageAdapter.get('customContratoTypes', false)
  ]);
  vehiculos = rv ? JSON.parse(rv.value) : [];
  if(rp) perfil = JSON.parse(rp.value);
  if(rd) customDocTypes = JSON.parse(rd.value);
  if(rc) customContratoTypes = JSON.parse(rc.value);
  await saveAppData();
}

/* ===== Copia local para carga instantánea =====
   Además de guardar en la nube, se guarda una copia en el propio dispositivo
   (localStorage). La próxima vez que se abra la app EN ESE MISMO dispositivo,
   se muestra esa copia al instante (sin esperar a Apps Script) mientras se
   trae la versión actualizada de fondo. Si tarda o falla la conexión, el
   usuario igual ve sus camionetas en vez de una pantalla vacía o en blanco. */
const APP_CACHE_KEY = 'geofleet_cache_v1';

function readAppCache(){
  try{
    const raw = localStorage.getItem(APP_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function writeAppCache(){
  try{ localStorage.setItem(APP_CACHE_KEY, JSON.stringify({vehiculos, perfil, customDocTypes, customContratoTypes})); }
  catch(e){ console.error('Error guardando copia local', e); }
}

function applyAppData(d){
  vehiculos = d.vehiculos || [];
  if(d.perfil) perfil = d.perfil;
  customDocTypes = d.customDocTypes || [];
  customContratoTypes = d.customContratoTypes || [];
}

async function saveAppData(){
  try{ await storageAdapter.set('appData', JSON.stringify({vehiculos, perfil, customDocTypes, customContratoTypes}), false); }
  catch(e){ console.error('Error guardando appData', e); }
  writeAppCache();
}

init();
async function init(){
  // 1) Si hay una copia guardada en este dispositivo, se muestra ya mismo.
  const cached = readAppCache();
  if(cached){
    applyAppData(cached);
    applyPerfilUI();
    renderVehList();
    const note = document.getElementById('storageNote');
    if(note) note.textContent = 'Mostrando datos guardados en este dispositivo. Actualizando…';
  }

  // 2) En paralelo (o si no había copia local), se trae la versión más
  // reciente de la nube y se refresca la pantalla cuando llega.
  try{
    await loadAppData();
    writeAppCache();
    applyPerfilUI();
    renderVehList();
    const note = document.getElementById('storageNote');
    if(note){
      note.textContent = usingLocalFallback
        ? 'Guardado localmente en este navegador (no en la nube). Si cambiás de compu o de navegador, no vas a ver estos datos.'
        : 'Los datos se guardan en tu cuenta de Claude.';
    }
  }catch(e){
    console.error('Error cargando datos', e);
    if(cached){
      // Ya se está mostrando la copia local: se avisa pero no se tapa la pantalla.
      const note = document.getElementById('storageNote');
      if(note) note.textContent = 'No se pudo actualizar desde la nube. Mostrando la última versión guardada en este dispositivo.';
    }else{
      showLoadError();
    }
  }
}

function showLoadError(){
  const main = document.getElementById('main');
  if(main){
    main.innerHTML = `<div class="empty-state">
      <h2>No se pudo conectar</h2>
      <p>Revisá tu conexión a internet (wifi o datos móviles) e intentá de nuevo. Si el problema sigue, probá cerrar y volver a abrir la app.</p>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="location.reload()">Reintentar</button>
    </div>`;
  }
  const note = document.getElementById('storageNote');
  if(note) note.textContent = 'No se pudo conectar. Tocá "Reintentar" arriba.';
}

function applyPerfilUI(){
  document.getElementById('brandName').textContent = perfil.empresa || 'Geofleet Rental y Servicios S.A.S';
  const mark = document.getElementById('brandMark');
  mark.innerHTML = perfil.logo ? `<img src="${perfil.logo}">` : (perfil.empresa||'G').trim()[0].toUpperCase();
}

function renderVehList(){
  const el = document.getElementById('vehList');
  if(vehiculos.length===0){ el.innerHTML = '<div style="color:#7C8794; font-size:12.5px; padding:10px 4px;">Todavía no agregaste camionetas.</div>'; return; }
  el.innerHTML = vehiculos.map(v => `
    <div class="veh-item ${v.patente===current?'active':''}" onclick="selectVehicle('${v.patente}')">
      <div class="plate-mini">${v.patente}</div>
      <div style="flex:1; min-width:0;">
        <div class="veh-name">${v.marca||'Sin marca'} ${v.modelo||''}</div>
        <div class="veh-sub ${v.estado==='vendido'?'vendido':''}">${v.estado==='vendido' ? 'Vendida' : (v.anio||'—')}</div>
      </div>
      <button class="veh-del" title="Borrar camioneta" onclick="event.stopPropagation(); eliminarCamioneta('${v.patente}')">🗑</button>
    </div>`).join('');
}

function openNewVehicle(){
  if(readerMode) return;
  const patente = prompt('Patente de la camioneta (ej: AD123CD):');
  if(!patente) return;
  const p = patente.trim().toUpperCase();
  if(vehiculos.find(v=>v.patente===p)){ alert('Ya existe una ficha con esa patente.'); selectVehicle(p); return; }
  vehiculos.push({patente:p, marca:'', modelo:'', anio:'', fechaCompra:'', valorCompra:'', fechaVenta:'', valorVenta:'', estado:'activo'});
  saveVehiculosList();
  selectVehicle(p);
}

async function saveVehiculosList(){
  await saveAppData();
  renderVehList();
}

async function eliminarCamioneta(patente){
  if(readerMode) return;
  const v = vehiculos.find(x=>x.patente===patente);
  const nombre = v ? `${patente} (${v.marca||'sin marca'} ${v.modelo||''})`.trim() : patente;
  if(!confirm(`¿Borrar la camioneta ${nombre}?\n\nSe va a eliminar TODA su información: fotos, documentos, contratos, seguros y siniestros cargados. Esta acción no se puede deshacer.`)) return;
  if(!confirm('Confirmá de nuevo: esto borra la ficha completa de forma permanente. ¿Continuar?')) return;

  // Se borra primero la ficha completa en la nube (fotos, documentos, etc.)
  try{ await storageAdapter.delete('ficha:' + patente, false); }
  catch(e){ console.error('Error borrando ficha de', patente, e); }

  // Se quita de la lista de camionetas y se guarda el cambio.
  vehiculos = vehiculos.filter(x=>x.patente !== patente);
  if(current === patente){ current = null; currentData = null; }
  await saveAppData();
  renderVehList();
  renderMain();
}

async function selectVehicle(patente){
  const isNew = !vehiculos.find(v=>v.patente===patente) ? false : true;
  current = patente; activeTab = 'datos'; editingDocId = null; editingRegId = null; editingContratoId = null; editingSiniestroId = null;
  const key = 'ficha:' + patente;
  let wasNew = false;
  try{
    const r = await storageAdapter.get(key, false);
    if(r){ currentData = JSON.parse(r.value); } else { currentData = defaultFicha(); wasNew = true; }
  }catch(e){
    // IMPORTANTE: si falla la conexión, NUNCA se trata como "camioneta nueva".
    // Antes, un error de red se confundía con "todavía no existe" y la app
    // guardaba automáticamente una ficha vacía, borrando fotos y datos reales
    // ya cargados. Ahora, si falla la lectura, se avisa y no se guarda nada.
    console.error('Error cargando ficha de', patente, e);
    currentData = null;
    renderVehList();
    renderFichaLoadError(patente);
    return;
  }
  if(!currentData.seguros) currentData.seguros = {libreDeuda:{}, certificado:{}, poliza:{}};
  if(!currentData.contratos) currentData.contratos = [];
  if(!currentData.siniestros) currentData.siniestros = [];
  if(!currentData.historial) currentData.historial = [];
  if(wasNew){ logHistorial('Ficha de la camioneta creada'); await saveCurrentFicha(); }
  renderVehList(); renderMain();
}
function renderFichaLoadError(patente){
  const main = document.getElementById('main');
  if(main){
    main.innerHTML = `<div class="empty-state">
      <h2>No se pudo cargar esta camioneta</h2>
      <p>Hubo un problema de conexión al traer los datos de "${patente}" desde la nube. Para evitar perder información, no se guardó ningún cambio. Revisá tu conexión e intentá de nuevo.</p>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="selectVehicle('${patente}')">Reintentar</button>
    </div>`;
  }
}
function defaultFicha(){ return { seguros:{libreDeuda:{}, certificado:{}, poliza:{}}, documentos: [], fotos: [], registros: [], contratos: [], siniestros: [], historial: [] }; }
async function saveCurrentFicha(){ if(!current) return; try{ await storageAdapter.set('ficha:' + current, JSON.stringify(currentData), false); }catch(e){ console.error(e); } }
function vehInfo(){ return vehiculos.find(v=>v.patente===current) || {}; }
function logHistorial(accion){ if(!currentData.historial) currentData.historial = []; currentData.historial.push({fecha: new Date().toISOString(), accion}); }

function renderMain(){
  if(!current){
    document.getElementById('main').innerHTML = `<div class="empty-state">
      <h2>Ninguna camioneta seleccionada</h2>
      <p>Agregá una camioneta por patente para empezar a cargar su ficha de trazabilidad.</p>
    </div>`;
    return;
  }
  const v = vehInfo();
  const main = document.getElementById('main');

/* ---------- ARCHIVOS: helpers compartidos (fotos + PDF) ---------- */
function isPdfFile(file){ return file.type === 'application/pdf' || /\.pdf$/i.test(file.name||''); }
function readAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function resizeImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleUpload(file, maxW, quality){
  if(!file) return null;
  if(isPdfFile(file)){
    if(file.size > 6000*1024){ alert('El PDF pesa '+Math.round(file.size/1024)+' KB. Subí uno de menos de 6 MB (o convertilo a foto) para que el sistema no se sature.'); return null; }
    const data = await readAsDataURL(file);
    return {fileData: data, fileType:'pdf', fileName:file.name};
  }
  const data = await resizeImage(file, maxW||1400, quality||0.85);
  return {fileData: data, fileType:'image', fileName:file.name};
}
function fileThumb(item, cssClass){
  if(!item || !item.fileData) return `<div class="${cssClass}"></div>`;
  if(item.fileType==='pdf') return `<a href="${item.fileData}" target="_blank" class="${cssClass==='doc-thumb'?'pdf-thumb':cssClass}">PDF</a>`;
  return `<img class="${cssClass}" src="${item.fileData}">`;
}

function siniestroCard(s){
  if(s.categoria==='infraccion'){
    const dotClass = s.pagada==='si'?'dot-green':(s.pagada==='reclamada'?'dot-yellow':'dot-red');
    const label = s.pagada==='si'?'Pagada':(s.pagada==='reclamada'?'Reclamada':'No pagada');
    const totalArchivos = (s.comprobantesPago?s.comprobantesPago.length:0) + (s.copiasInfraccion?s.copiasInfraccion.length:0);
    const primerArchivo = (s.comprobantesPago&&s.comprobantesPago[0]) || (s.copiasInfraccion&&s.copiasInfraccion[0]) || null;
    return `
    <div class="doc-card" style="margin-top:12px; align-items:center;">
      ${fileThumb(primerArchivo,'doc-thumb')}
      <div class="doc-info">
        <div class="name">Infracción — ${formatDate(s.fecha)}</div>
        <div class="meta">${[s.lugar&&('Lugar: '+s.lugar), s.responsable&&('Responsable: '+s.responsable)].filter(Boolean).join(' · ')}</div>
        <div class="meta">${s.monto?('Monto: $'+s.monto):''}${totalArchivos?(' · '+totalArchivos+' archivo(s)'):''}</div>
        <div class="meta">${s.detalle||''}</div>
        <span class="status-chip"><span class="dot ${dotClass}"></span>${label}</span>
      </div>
      <div class="doc-actions ${readerMode?'hidden':''}">
        <button class="icon-btn" onclick="editSiniestro('${s.id}')">Editar</button>
        <button class="icon-btn danger" onclick="delSiniestro('${s.id}')">Eliminar</button>
      </div>
    </div>`;
  }
  const covClass = s.cobertura==='positiva'?'pos':s.cobertura==='negativa'?'neg':'tram';
  const covLabel = s.cobertura==='positiva'?'Cobertura positiva':s.cobertura==='negativa'?'Cobertura negativa':'En trámite';
  return `
    <div class="doc-card" style="margin-top:12px; align-items:center;">
      ${fileThumb((s.fotos&&s.fotos[0])||null,'doc-thumb')}
      <div class="doc-info">
        <div class="name">${s.tipo} — ${formatDate(s.fecha)}</div>
        <div class="meta">${s.detalle||''}</div>
        <div class="meta">${s.franquicia?('Franquicia: '+s.franquicia):''}${s.fotos&&s.fotos.length?(' · '+s.fotos.length+' archivo(s)'):''}</div>
        <span class="status-chip status-${covClass}">${covLabel}</span>
      </div>
      <div class="doc-actions ${readerMode?'hidden':''}">
        <button class="icon-btn" onclick="editSiniestro('${s.id}')">Editar</button>
        <button class="icon-btn danger" onclick="delSiniestro('${s.id}')">Eliminar</button>
      </div>
    </div>`;
}

  input.value=''; renderSinFields('siniestro');
}
function delSinFoto(idx){ sinFotosTemp.splice(idx,1); renderSinFields('siniestro'); }
async function addSinComprobante(input){

  input.value=''; renderSinFields('infraccion');
}
function delSinComprobante(idx){ sinComprobantesTemp.splice(idx,1); renderSinFields('infraccion'); }
async function addSinCopia(input){

async function addSiniestro(){
  const categoria = document.getElementById('sinCategoria').value;
  if(categoria==='infraccion'){
    const lugar = document.getElementById('sinLugar').value;
    currentData.siniestros.push({
      id: cryptoId(), categoria:'infraccion',
      fecha: document.getElementById('sinFecha').value,
      lugar, responsable: document.getElementById('sinResponsable').value,
      monto: document.getElementById('sinMonto').value,
      pagada: document.getElementById('sinPagada').value,
      detalle: document.getElementById('sinDetalle').value,
      comprobantesPago: [...sinComprobantesTemp],
      copiasInfraccion: [...sinCopiasTemp]
    });
    logHistorial('Infracción agregada'+(lugar?(': '+lugar):''));
    sinComprobantesTemp = []; sinCopiasTemp = [];
  } else {
    const tipo = document.getElementById('sinTipo').value.trim();
    if(!tipo){ alert('Indicá el tipo de siniestro.'); return; }
    currentData.siniestros.push({
      id: cryptoId(), categoria:'siniestro', tipo, fecha: document.getElementById('sinFecha').value,
      cobertura: document.getElementById('sinCobertura').value,
      franquicia: document.getElementById('sinFranquicia').value,
      detalle: document.getElementById('sinDetalle').value,
      fotos: [...sinFotosTemp]
    });
    logHistorial('Siniestro agregado: '+tipo);
    sinFotosTemp = [];
  }
  await saveCurrentFicha(); renderTab();
}
function editSiniestro(id){ editingSiniestroId = id; renderTab(); }
function cancelSiniestroEdit(){ editingSiniestroId = null; sinFotosTemp=[]; sinComprobantesTemp=[]; sinCopiasTemp=[]; renderTab(); }
async function saveSiniestroEdit(){
  const categoria = document.getElementById('sinCategoria').value;
  const s = currentData.siniestros.find(x=>x.id===editingSiniestroId);
  s.categoria = categoria;
  if(categoria==='infraccion'){
    s.fecha = document.getElementById('sinFecha').value;
    s.lugar = document.getElementById('sinLugar').value;
    s.responsable = document.getElementById('sinResponsable').value;
    s.monto = document.getElementById('sinMonto').value;
    s.pagada = document.getElementById('sinPagada').value;
    s.detalle = document.getElementById('sinDetalle').value;
    s.comprobantesPago = [...sinComprobantesTemp];
    s.copiasInfraccion = [...sinCopiasTemp];
    delete s.tipo; delete s.cobertura; delete s.franquicia; delete s.fotos;
    logHistorial('Infracción editada'+(s.lugar?(': '+s.lugar):''));
  } else {
    s.tipo = document.getElementById('sinTipo').value.trim() || s.tipo;
    s.fecha = document.getElementById('sinFecha').value;
    s.cobertura = document.getElementById('sinCobertura').value;
    s.franquicia = document.getElementById('sinFranquicia').value;
    s.detalle = document.getElementById('sinDetalle').value;
    s.fotos = [...sinFotosTemp];
    delete s.lugar; delete s.responsable; delete s.monto; delete s.pagada; delete s.comprobantesPago; delete s.copiasInfraccion;
    logHistorial('Siniestro editado: '+s.tipo);
  }
  editingSiniestroId = null; sinFotosTemp=[]; sinComprobantesTemp=[]; sinCopiasTemp=[];
  await saveCurrentFicha(); renderTab();
}
function delSiniestro(id){
  if(!confirm('¿Eliminar este registro?')) return;
  const s = currentData.siniestros.find(x=>x.id===id);
  currentData.siniestros = currentData.siniestros.filter(x=>x.id!==id);
  logHistorial((s&&s.categoria==='infraccion'?'Infracción eliminada':'Siniestro eliminado')+(s&&s.tipo?(': '+s.tipo):''));
  saveCurrentFicha(); renderTab();
}

function onFotoFileChange(input){
  const btn = document.getElementById('fotoFileBtn');
  btn.textContent = input.files.length>1 ? (input.files.length+' archivos seleccionados') : (input.files[0] ? input.files[0].name : 'Fotos o PDF');
  btn.classList.toggle('has-file', !!input.files.length);
}
async function addFoto(){
  const fileInput = document.getElementById('fotoFile');
  if(!fileInput.files.length){ alert('Elegí al menos un archivo primero.'); return; }
  const desc = document.getElementById('fotoDesc').value;
  const uploaded = await uploadMultiple(fileInput.files, 1600, 0.85);
  if(!uploaded.length) return;
  uploaded.forEach((res,i)=>{
    currentData.fotos.push({id: cryptoId(), desc: uploaded.length>1 ? (desc?`${desc} (${i+1})`:'') : desc, fileData: res.fileData, fileType: res.fileType, fecha: todayISO()});
  });
  logHistorial(uploaded.length+' foto(s)/archivo(s) agregado(s) al vehículo'+(desc?(': '+desc):''));
  await saveCurrentFicha(); renderTab();
}
async function addFotosFolder(input){
  const files = Array.from(input.files || []).filter(f => f.type.startsWith('image/') || isPdfFile(f));
  if(files.length===0){ alert('No se encontraron imágenes o PDFs en esa carpeta.'); return; }
  let added = 0;
  for(const f of files){
    try{
      const res = await handleUpload(f, 1600, 0.82);
      if(res){ currentData.fotos.push({id: cryptoId(), desc: f.name, fileData: res.fileData, fileType: res.fileType, fecha: todayISO()}); added++; }
    }catch(e){}
  }
  logHistorial(added+' foto(s)/archivo(s) cargados desde carpeta');
  await saveCurrentFicha(); renderTab();
}
function editFotoDesc(id){
  const f = currentData.fotos.find(x=>x.id===id);
  const nuevo = prompt('Descripción:', f.desc||'');
  if(nuevo===null) return;
  f.desc = nuevo; saveCurrentFicha(); renderTab();
}
function delFoto(id){ if(!confirm('¿Eliminar este archivo?')) return; currentData.fotos = currentData.fotos.filter(f=>f.id!==id); saveCurrentFicha(); renderTab(); }

function regRow(r){
  let periodo = '';
  let detalle = '';
  if(r.tipo==='uso'){
    periodo = formatDate(r.fechaInicio) + ' → ' + (r.enCurso ? '<b style="color:#946200;">continúa alquilada</b>' : (r.fechaFin?formatDate(r.fechaFin):'—'));
    detalle = [r.cliente&&('Cliente: '+r.cliente), r.rubro&&('Rubro: '+r.rubro), (r.kmInicio||r.kmFin)&&('Km: '+(r.kmInicio||'-')+' → '+(r.kmFin||'-'))].filter(Boolean).join(' · ');
  } else {
    periodo = formatDate(r.fecha);
    detalle = r.detalle||'';
    if(r.fotos && r.fotos.length) detalle += ' · 📷 '+r.fotos.length;
    if(r.archivos && r.archivos.length) detalle += ' · 📎 '+r.archivos.length;
  }
  return `<tr>
    <td>${periodo}</td>
    <td><span class="tag tag-${r.tipo==='uso'?'uso':r.tipo==='mantenimiento'?'mant':'inc'}">${r.tipo}</span></td>
    <td>${detalle}</td>
    <td class="${readerMode?'hidden':''}"><button class="icon-btn" onclick="editRegistro('${r.id}')">Editar</button> <button class="icon-btn danger" onclick="delRegistro('${r.id}')">Eliminar</button></td>

function collectRegForm(){
  const tipo = document.getElementById('regTipo').value;
  if(tipo==='uso'){
    return { tipo, cliente:document.getElementById('regCliente').value, cuit:document.getElementById('regCuit').value, rubro:document.getElementById('regRubro').value,
      fechaInicio:document.getElementById('regFInicio').value,
      enCurso:document.getElementById('regEnCurso').checked, fechaFin:document.getElementById('regEnCurso').checked?'':document.getElementById('regFFin').value,
      kmInicio:document.getElementById('regKmInicio').value, kmFin:document.getElementById('regKmFin').value, notas:document.getElementById('regNotas').value };
  }
  const base = { tipo, fecha:document.getElementById('regFecha').value, detalle:document.getElementById('regDetalle').value };
  if(tipo==='mantenimiento'){ base.fotos = [...regMantFotos]; base.archivos = [...regMantArchivos]; }

  if(data.tipo!=='uso' && !data.detalle){ alert('Cargá un detalle.'); return; }
  currentData.registros.push({id: cryptoId(), ...data});
  logHistorial('Registro de '+data.tipo+' agregado');
  regMantFotos=[]; regMantArchivos=[];
  await saveCurrentFicha(); renderTab();
}

  saveCurrentFicha(); renderTab();
}

function simpleHash(str){
  let h1 = 0, h2 = 0;
  for(let i=0;i<str.length;i++){
    h1 = (Math.imul(31,h1) + str.charCodeAt(i))|0;
    h2 = (Math.imul(17,h2) + str.charCodeAt(i)*7)|0;
  }
  return ((h1>>>0).toString(16)+(h2>>>0).toString(16)).toUpperCase().slice(0,10);
}

function fitImage(doc, item, x, y, maxW, maxH){
  if(!item || !item.fileData || item.fileType==='pdf') return {w:0,h:0,drawn:false};
  try{
    const props = doc.getImageProperties(item.fileData);
    const ratio = Math.min(maxW/props.width, maxH/props.height);
    const w = props.width*ratio, h = props.height*ratio;
    const ox = x + (maxW-w)/2, oy = y + (maxH-h)/2;
    doc.addImage(item.fileData, props.fileType, ox, oy, w, h);
    return {w,h,drawn:true};
  }catch(e){ return {w:0,h:0,drawn:false}; }
}

async function exportarPDF(){
  const selected = Array.from(document.querySelectorAll('.expVehCheck:checked')).map(cb=>cb.value);
  if(selected.length===0){ alert('Elegí al menos una camioneta.'); return; }
  const incl = {
    datos: document.getElementById('expDatos').checked,
    seguros: document.getElementById('expSeguros').checked,
    docs: document.getElementById('expDocs').checked,
    contratos: document.getElementById('expContratos').checked,
    siniestros: document.getElementById('expSiniestros').checked,
    fotos: document.getElementById('expFotos').checked,
    registros: document.getElementById('expRegistros').checked,
    historial: document.getElementById('expHistorial').checked,
  };
  closeOverlay('expOverlay');
  const fallasCarga = [];

  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 42;
  let y = margin;

  /* Acá se acumulan todos los PDF adjuntos (pólizas, siniestros, etc.) que
     se encuentran mientras se arma el reporte, para incluirlos de verdad
     como páginas al final del PDF exportado (Anexo). */
  const adjuntosPdf = [];
  function registrarAdjuntoPdf(item, meta){
    if(!item || !item.fileData) return;
    adjuntosPdf.push({
      fileData: item.fileData,
      fileName: item.fileName || 'documento.pdf',
      patente: (meta && meta.patente) || '',
      label: (meta && meta.label) || 'Documento adjunto'
    });
  }

  function ensureSpace(h){ if(y + h > pageH - 60){ doc.addPage(); y = margin; } }
  function heading(text, size){
    size = size||14;
    ensureSpace(size*1.9);
    doc.setFillColor(243,245,247); doc.rect(margin-4, y-size*0.85, pageW-margin*2+8, size*1.65, 'F');
    doc.setFillColor(232,89,12); doc.rect(margin-4, y-size*0.85, 3, size*1.65, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(size); doc.setTextColor(22,32,42);
    doc.text(text, margin+8, y); y += size*1.55;
  }
  function writeText(text, x, maxWidth, opts){
    opts = opts||{};
    const size = opts.size||10;
    doc.setFont(opts.font||'helvetica', opts.style||'normal'); doc.setFontSize(size);
    const col = opts.color||[90,98,108]; doc.setTextColor(col[0],col[1],col[2]);
    const lines = doc.splitTextToSize(text||'', maxWidth);
    ensureSpace(lines.length*(size*1.25)+4);
    doc.text(lines, x, y);
    y += lines.length*(size*1.25);
  }
  function line(){ ensureSpace(14); doc.setDrawColor(214,218,225); doc.line(margin,y,pageW-margin,y); y += 14; }
  function thumbRow(items, xStart, meta){
    if(!items || !items.length) return;
    const tw=54, th=54, gap=8;
    let tx = xStart, used = false;
    for(const it of items){
      if(tx + tw > pageW - margin){ tx = xStart; y += th + 8; }
      ensureSpace(th+12);
      if(it.fileType==='pdf'){
        doc.setDrawColor(214,218,225); doc.setFillColor(243,233,227);
        doc.roundedRect(tx, y, tw, th, 4, 4, 'FD');
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(178,58,27);
        doc.text('PDF', tx+tw/2, y+th/2+3-4, {align:'center'});
        doc.setFont('helvetica','normal'); doc.setFontSize(6);
        doc.text('Ver Anexo', tx+tw/2, y+th/2+8, {align:'center'});
        if(it.fileData) registrarAdjuntoPdf(it, meta);
      } else {
        fitImage(doc, it, tx, y, tw, th);
        doc.setDrawColor(214,218,225); doc.rect(tx, y, tw, th);
      }
      tx += tw + gap; used = true;
    }
    if(used) y += th + 12;
  }

  // Banner de empresa (una sola vez)
  doc.setFillColor(22,32,42); doc.rect(0,0,pageW,80,'F');
  if(perfil.logo){ fitImage(doc, {fileData:perfil.logo, fileType:'image'}, pageW-86, 13, 54, 54); }
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(255,255,255);
  doc.text(perfil.empresa || 'Geofleet Rental y Servicios S.A.S', margin, 32);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(190,197,205);
  doc.text('Reporte de trazabilidad' + (perfil.cuit?('   ·   CUIT '+perfil.cuit):'') + (selected.length>1?('   ·   '+selected.length+' camionetas'):''), margin, 47);
  doc.text('Generado: '+new Date().toLocaleString('es-AR'), margin, 61);
  y = 100;

  let firstVeh = true;
  for(const patente of selected){
    const v = vehiculos.find(x=>x.patente===patente) || {patente};
    let ficha;
    if(patente===current && currentData){ ficha = currentData; }
    else{
      try{
        const r = await storageAdapter.get('ficha:'+patente, false);
        ficha = r ? JSON.parse(r.value) : defaultFicha();
      }catch(e){
        // Si falla la conexión, NO se asume que está vacía: se avisa al final
        // en vez de generar un PDF incompleto sin que el usuario lo sepa.
        ficha = defaultFicha();
        fallasCarga.push(patente);
      }
    }
    if(!ficha.seguros) ficha.seguros = {libreDeuda:{}, certificado:{}, poliza:{}};
    if(!ficha.contratos) ficha.contratos = [];
    if(!ficha.siniestros) ficha.siniestros = [];
    if(!ficha.historial) ficha.historial = [];

    if(!firstVeh){ doc.addPage(); y = margin; }
    firstVeh = false;

    ensureSpace(30);
    doc.setFillColor(232,89,12); doc.rect(margin, y, 4, 22, 'F');
    doc.setFont('courier','bold'); doc.setFontSize(15); doc.setTextColor(22,32,42);
    doc.text(v.patente, margin+12, y+16);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(90,98,108);
    doc.text(`${v.marca||''} ${v.modelo||''}   ·   Año ${v.anio||'-'}`, margin+115, y+16);
    y += 34;

    if(incl.datos){
      heading('Datos del vehículo', 12.5);
      writeText(`Fecha de compra: ${v.fechaCompra?formatDate(v.fechaCompra):'-'}${v.valorCompra?('   ·   Valor: '+v.valorCompra):''}`, margin, pageW-margin*2);
      if(v.estado==='vendido') writeText(`Fecha de venta: ${v.fechaVenta?formatDate(v.fechaVenta):'-'}${v.valorVenta?('   ·   Valor: '+v.valorVenta):''}`, margin, pageW-margin*2);
      else writeText('Estado: en flota activa', margin, pageW-margin*2);
      y += 6; line();
    }

    if(incl.seguros){
      heading('Seguros', 12.5);
      for(const k of Object.keys(SEG_LABELS)){
        const seg = ficha.seguros[k] || {};
        const st = seguroStatus(seg);
        ensureSpace(66);
        const imgBox = {x:margin, y:y, w:56, h:56};
        if(seg.fileData && seg.fileType!=='pdf'){ fitImage(doc, seg, imgBox.x, imgBox.y, imgBox.w, imgBox.h); }
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
        doc.text(SEG_LABELS[k], margin+68, y+14);
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,98,108);
        doc.text(`Estado: ${st.label}${seg.vencimiento?('   ·   Vence: '+formatDate(seg.vencimiento)):''}`, margin+68, y+30);
        if(seg.fileData && seg.fileType==='pdf'){
          doc.text('PDF adjunto: '+(seg.fileName||'documento')+'  (ver Anexo)', margin+68, y+44);
          registrarAdjuntoPdf(seg, {patente: v.patente, label: SEG_LABELS[k]});
        }
        y += 66;
      }
      line();
    }

    if(incl.docs){
      heading('Documentación', 12.5);
      if(ficha.documentos.length===0) writeText('Sin documentos cargados.', margin, pageW-margin*2);
      for(const d of ficha.documentos){
        ensureSpace(78);
        const yStart = y;
        if(d.fileData && d.fileType!=='pdf') fitImage(doc, d, margin, y, 62, 62);
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
        doc.text(d.tipo, margin+74, y+13);
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,98,108);
        let ny = y+28;
        if(d.nota){ const lines = doc.splitTextToSize(d.nota, pageW-margin*2-74); doc.text(lines, margin+74, ny); ny += lines.length*12; }
        doc.text(d.vencimiento ? ('Vencimiento: '+formatDate(d.vencimiento)) : 'Sin vencimiento', margin+74, ny);
        if(d.fileData && d.fileType==='pdf'){
          ny+=13; doc.text('PDF adjunto: '+(d.fileName||'documento')+'  (ver Anexo)', margin+74, ny);
          registrarAdjuntoPdf(d, {patente: v.patente, label: 'Documentación — '+d.tipo});
        }
        y = Math.max(yStart+70, ny+16);
        thumbRow(d.extraFotos, margin, {patente: v.patente, label: 'Documentación — '+d.tipo});
      }
      line();
    }

    if(incl.contratos){
      heading('Contrato / Legales', 12.5);
      if(ficha.contratos.length===0) writeText('Sin documentos cargados.', margin, pageW-margin*2);
      for(const d of ficha.contratos){
        ensureSpace(78);
        const yStart = y;
        if(d.fileData && d.fileType!=='pdf') fitImage(doc, d, margin, y, 62, 62);
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
        doc.text(d.tipo, margin+74, y+13);
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,98,108);
        let ny = y+28;
        const info = [d.empresa, d.nota].filter(Boolean).join(' · ');
        if(info){ const lines = doc.splitTextToSize(info, pageW-margin*2-74); doc.text(lines, margin+74, ny); ny += lines.length*12; }
        if(d.fecha) doc.text(formatDate(d.fecha), margin+74, ny);
        if(d.fileData && d.fileType==='pdf'){
          ny+=13; doc.text('PDF adjunto: '+(d.fileName||'documento')+'  (ver Anexo)', margin+74, ny);
          registrarAdjuntoPdf(d, {patente: v.patente, label: 'Contrato — '+d.tipo});
        }
        y = Math.max(yStart+70, ny+16);
        thumbRow(d.extraFotos, margin, {patente: v.patente, label: 'Contrato — '+d.tipo});
      }
      line();
    }

    if(incl.siniestros){
      heading('Siniestros / Infracciones', 12.5);
      if(ficha.siniestros.length===0) writeText('Sin siniestros o infracciones cargados.', margin, pageW-margin*2);
      for(const s of ficha.siniestros){
        ensureSpace(78);
        const yStart = y;
        if(s.categoria==='infraccion'){
          const primerFoto = (s.comprobantesPago&&s.comprobantesPago[0]) || (s.copiasInfraccion&&s.copiasInfraccion[0]);
          if(primerFoto && primerFoto.fileType!=='pdf') fitImage(doc, primerFoto, margin, y, 62, 62);
          doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
          doc.text(`Infracción — ${formatDate(s.fecha)}`, margin+74, y+13);
          doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,98,108);
          const infoLine = [s.lugar&&('Lugar: '+s.lugar), s.responsable&&('Responsable: '+s.responsable)].filter(Boolean).join('   ·   ');
          if(infoLine) doc.text(infoLine, margin+74, y+28);
          const pagLabel = s.pagada==='si'?'Pagada':(s.pagada==='reclamada'?'Reclamada':'No pagada');
          const pagColor = s.pagada==='si'?[47,125,79]:(s.pagada==='reclamada'?[214,160,42]:[192,57,43]);
          doc.setFont('helvetica','bold'); doc.setTextColor(pagColor[0],pagColor[1],pagColor[2]);
          const pagTxt = `● ${pagLabel}` + (s.monto ? `   ·   Monto: $${s.monto}` : '');
          doc.text(pagTxt, margin+74, y+42);
          let ny = y+56;
          if(s.detalle){ doc.setFont('helvetica','normal'); doc.setTextColor(90,98,108); const lines = doc.splitTextToSize(s.detalle, pageW-margin*2-74); doc.text(lines, margin+74, ny); ny += lines.length*12; }
          y = Math.max(yStart+70, ny+10);
          thumbRow([...(s.comprobantesPago||[]), ...(s.copiasInfraccion||[])], margin, {patente: v.patente, label: 'Infracción — '+formatDate(s.fecha)});
        } else {
          const primerFoto = s.fotos && s.fotos[0];
          if(primerFoto && primerFoto.fileType!=='pdf') fitImage(doc, primerFoto, margin, y, 62, 62);
          doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
          doc.text(`${s.tipo} — ${formatDate(s.fecha)}`, margin+74, y+13);
          doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,98,108);
          const covLabel = s.cobertura==='positiva'?'Cobertura positiva':s.cobertura==='negativa'?'Cobertura negativa':'En trámite';
          doc.text(`${covLabel}${s.franquicia?('   ·   Franquicia: '+s.franquicia):''}`, margin+74, y+28);
          let ny = y+42;
          if(s.detalle){ const lines = doc.splitTextToSize(s.detalle, pageW-margin*2-74); doc.text(lines, margin+74, ny); ny += lines.length*12; }
          y = Math.max(yStart+70, ny+10);
          thumbRow(s.fotos, margin, {patente: v.patente, label: 'Siniestro — '+s.tipo+' — '+formatDate(s.fecha)});
        }
      }
      line();
    }

    if(incl.fotos){
      heading('Fotos del vehículo', 12.5);
      const imgs = ficha.fotos.filter(f=>f.fileType!=='pdf');
      const pdfs = ficha.fotos.filter(f=>f.fileType==='pdf');
      if(ficha.fotos.length===0) writeText('Sin fotos cargadas.', margin, pageW-margin*2);
      let fx = margin, fCount = 0; const fw=105, fh=85, gap=12;
      for(const f of imgs){
        if(fCount>0 && fCount % 4 === 0){ y += fh + 20; fx = margin; ensureSpace(fh+20); }
        ensureSpace(fh+24);
        fitImage(doc, f, fx, y, fw, fh);
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,98,108);
        doc.text((f.desc||formatDate(f.fecha)).slice(0,20), fx, y+fh+10);
        fx += fw + gap; fCount++;
      }
      if(imgs.length>0) y += fh + 22;
      if(pdfs.length>0){
        writeText('Archivos PDF adjuntos: '+pdfs.map(p=>p.fileName||'documento').join(', ')+'  (ver Anexo)', margin, pageW-margin*2);
        pdfs.forEach(p=>registrarAdjuntoPdf(p, {patente: v.patente, label: 'Foto — '+(p.desc||'documento')}));
      }
      line();
    }

    if(incl.registros){
      heading('Registro de uso y mantenimiento', 12.5);
      const regs = [...ficha.registros].sort((a,b)=> (b.fechaInicio||b.fecha||'').localeCompare(a.fechaInicio||a.fecha||''));
      if(regs.length===0) writeText('Sin registros cargados.', margin, pageW-margin*2);
      for(const r of regs){
        ensureSpace(20);
        doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(232,89,12);
        doc.text(`[${r.tipo.toUpperCase()}]`, margin, y);
        let txt = '';
        if(r.tipo==='uso'){
          txt = `${formatDate(r.fechaInicio)} -> ${r.enCurso?'continua alquilada':(r.fechaFin?formatDate(r.fechaFin):'-')} - ${r.cliente||''}`;
          if(r.cuit) txt += ` - CUIT ${r.cuit}`;
          if(r.rubro) txt += ` - ${r.rubro}`;
          if(r.kmInicio||r.kmFin) txt += ` - Km ${r.kmInicio||'-'} a ${r.kmFin||'-'}`;
          if(r.notas) txt += ` - Notas: ${r.notas}`;
        }
        else{
          txt = `${formatDate(r.fecha)} - ${r.detalle}`;
        }
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(40,40,40);
        const lines = doc.splitTextToSize(txt, pageW-margin*2-78);
        ensureSpace(lines.length*12+4);
        doc.text(lines, margin+78, y);
        y += Math.max(16, lines.length*12+4);
        if(r.tipo==='mantenimiento'){
          thumbRow([...(r.fotos||[]), ...(r.archivos||[])], margin+78, {patente: v.patente, label: 'Mantenimiento — '+formatDate(r.fecha)});
        }
      }
      line();
    }

    if(incl.historial){
      heading('Historial de modificaciones', 12.5);
      const hist = [...ficha.historial].sort((a,b)=> b.fecha.localeCompare(a.fecha));
      if(hist.length===0) writeText('Sin movimientos registrados.', margin, pageW-margin*2);
      for(const h of hist){
        ensureSpace(14);
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,98,108);
        doc.text(formatDateTime(h.fecha), margin, y);
        doc.setTextColor(40,40,40);
        doc.text(h.accion, margin+120, y, {maxWidth: pageW-margin*2-120});
        y += 13;
      }
    }
  }

  // Sello de validación
  ensureSpace(90);
  y += 10;
  const stampY = y;
  doc.setDrawColor(232,89,12); doc.setLineWidth(1.2);
  doc.roundedRect(margin, stampY, pageW-margin*2, 66, 6, 6);
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(22,32,42);
  doc.text('Documento validado por el sistema de trazabilidad', margin+14, stampY+20);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,98,108);
  doc.text(`${perfil.empresa || 'Geofleet Rental y Servicios S.A.S'}${perfil.cuit?('  ·  CUIT '+perfil.cuit):''}`, margin+14, stampY+34);
  const codigo = simpleHash(selected.join(',')+'|'+new Date().toISOString()+'|'+(perfil.cuit||''));
  doc.text(`Generado: ${new Date().toLocaleString('es-AR')}   ·   Código de verificación: ${codigo}`, margin+14, stampY+47);
  doc.setFontSize(7.5); doc.setTextColor(140,148,156);
  doc.text('Este sello certifica que el documento fue generado desde el sistema interno de la empresa en la fecha indicada. No constituye una firma digital con registro legal.', margin+14, stampY+59, {maxWidth: pageW-margin*2-28});

  // Pie de página profesional en todas las hojas del reporte principal
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setDrawColor(224,227,231); doc.setLineWidth(0.7);
    doc.line(margin, pageH-38, pageW-margin, pageH-38);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,148,156);
    doc.text(perfil.empresa || 'Geofleet Rental y Servicios S.A.S', margin, pageH-24);
    doc.text(`Página ${p} de ${totalPages}`, pageW-margin, pageH-24, {align:'right'});
    doc.setFontSize(7.5);
    doc.text('Documento de uso interno — generado por el sistema de trazabilidad de flota', margin, pageH-13);
  }

  const fileName = selected.length===1 ? `trazabilidad-${selected[0]}.pdf` : `trazabilidad-flota-${todayISO()}.pdf`;

  if(fallasCarga.length > 0){
    alert('Atención: no se pudo traer de la nube la información de estas camionetas por un problema de conexión, así que en el PDF van a figurar vacías: ' + fallasCarga.join(', ') + '. Revisá tu conexión y volvé a exportar para incluirlas completas.');
  }

  // Si no hay PDF adjuntos reales para anexar, se descarga tal cual (comportamiento anterior).
  if(adjuntosPdf.length === 0 || typeof PDFLib === 'undefined'){
    doc.save(fileName);
    return;
  }

  // Hay archivos PDF cargados dentro de la ficha (pólizas, siniestros, etc.):
  // se anexan de verdad al final, con su contenido real y legible, no solo el nombre.
  try{
    const mainBytes = doc.output('arraybuffer');
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const finalPdf = await PDFDocument.load(mainBytes);
    const font = await finalPdf.embedFont(StandardFonts.HelveticaBold);
    const fontN = await finalPdf.embedFont(StandardFonts.Helvetica);

    // Portada del anexo
    const coverW = 595.28, coverH = 841.89; // A4 en puntos
    const cover = finalPdf.addPage([coverW, coverH]);
    cover.drawText('Anexo: documentos PDF adjuntos', {x:42, y: coverH-70, size:16, font, color: rgb(0.09,0.13,0.16)});
    cover.drawText('A continuación se incluyen, con su contenido completo, los archivos PDF', {x:42, y: coverH-96, size:9.5, font: fontN, color: rgb(0.35,0.38,0.42)});
    cover.drawText('que estaban cargados en la ficha (pólizas, siniestros, contratos, etc.).', {x:42, y: coverH-110, size:9.5, font: fontN, color: rgb(0.35,0.38,0.42)});
    let ty = coverH-150;
    adjuntosPdf.forEach((a,i)=>{
      if(ty < 60){ return; } // evita desbordar la portada; el documento igual se anexa más abajo
      cover.drawText(`${i+1}. ${a.patente} — ${a.label} — ${a.fileName}`, {x:42, y: ty, size:9.5, font: fontN, color: rgb(0.16,0.19,0.22)});
      ty -= 16;
    });

    for(const a of adjuntosPdf){
      try{
        const base64 = (a.fileData.split(',')[1]) || a.fileData;
        const bytes = Uint8Array.from(atob(base64), c=>c.charCodeAt(0));
        const srcPdf = await PDFDocument.load(bytes, {ignoreEncryption:true});
        const titlePage = finalPdf.addPage([coverW, coverH]);
        titlePage.drawText(a.patente, {x:42, y: coverH-70, size:14, font, color: rgb(0.91,0.35,0.05)});
        titlePage.drawText(a.label, {x:42, y: coverH-92, size:12, font, color: rgb(0.09,0.13,0.16)});
        titlePage.drawText('Archivo: '+a.fileName, {x:42, y: coverH-112, size:9.5, font: fontN, color: rgb(0.35,0.38,0.42)});
        const copied = await finalPdf.copyPages(srcPdf, srcPdf.getPageIndices());
        copied.forEach(p=>finalPdf.addPage(p));
      }catch(errAdj){
        // Si un archivo adjunto puntual está dañado, no se cae todo el export: se avisa en una página y se sigue.
        const errPage = finalPdf.addPage([coverW, coverH]);
        errPage.drawText(a.patente+' — '+a.label, {x:42, y: coverH-70, size:13, font, color: rgb(0.75,0.22,0.1)});
        errPage.drawText('No se pudo incluir este archivo ('+a.fileName+').', {x:42, y: coverH-94, size:10, font: fontN, color: rgb(0.35,0.38,0.42)});
        errPage.drawText('El archivo original puede estar dañado o no ser un PDF válido.', {x:42, y: coverH-110, size:9, font: fontN, color: rgb(0.55,0.58,0.62)});
      }
    }

    const finalBytes = await finalPdf.save();
    const blob = new Blob([finalBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(errMerge){
    console.error('Error anexando PDFs, se descarga el reporte sin anexo:', errMerge);
    doc.save(fileName);
  }
}

/* ---------- UTILS ---------- */
function cryptoId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function formatDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
</script>
</body>
</html>
